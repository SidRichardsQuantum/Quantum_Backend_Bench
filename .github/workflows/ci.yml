name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[cirq,plot,yaml,tket,docs,dev]"

      - name: Check formatting
        run: black --check quantum_backend_bench tests examples docs/pages

      - name: Lint
        run: ruff check quantum_backend_bench tests examples docs/pages

      - name: Run tests
        run: pytest

      - name: Build docs and validate local links
        run: pytest tests/test_docs_links.py -m "docs or not docs"

      - name: Check generated notebook results are current
        run: |
          python docs/pages/build_notebook_results.py
          git diff --exit-code -- docs/RESULTS.md docs/pages/assets/notebooks

      - name: Run Cirq smoke regression gate
        run: |
          quantum-bench suite smoke \
            --backends cirq \
            --shots 128 \
            --save-json artifacts/ci_smoke_suite_cirq.json
          quantum-bench diff \
            examples/reference_results/cirq_smoke_2026-06-03/smoke_suite_cirq.json \
            artifacts/ci_smoke_suite_cirq.json \
            --metric depth \
            --metric gate_count \
            --metric two_qubit_gate_count \
            --metric total_variation_distance \
            --absolute-threshold 0.15 \
            --fail-on-regression

      - name: Check package documentation manifest
        run: pytest tests/test_packaging.py -k required_docs

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

  optional-backends:
    name: Optional backend smoke (${{ matrix.extra }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pennylane
            filter: pennylane
          - extra: braket
            filter: braket
          - extra: qiskit
            filter: qiskit
          - extra: cudaq
            filter: cudaq
            experimental: true
          - extra: pyquil
            filter: pyquil
          - extra: qutip
            filter: qutip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[${{ matrix.extra }},dev]"

      - name: Run backend smoke tests without silent skips
        if: ${{ matrix.extra != 'cudaq' }}
        run: |
          set -o pipefail
          pytest tests/test_backends.py \
            -k "${{ matrix.filter }}" \
            -m "optional_sdk and not heavy_sdk and not external_runtime" \
            -rA | tee pytest-output.txt
          python .github/scripts/fail_if_pytest_skips.py pytest-output.txt

      - name: Run experimental heavy backend smoke tests
        if: ${{ matrix.extra == 'cudaq' }}
        run: pytest tests/test_backends.py -k "${{ matrix.filter }}" -m "optional_sdk and heavy_sdk" -rA
