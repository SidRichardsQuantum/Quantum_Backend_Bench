name: Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - USAGE.md
      - docs/RESULTS.md
      - docs/SDK_AUDITS.md
      - docs/THEORY.md
      - docs/METHODOLOGY.md
      - docs/PROBLEM.md
      - docs/SCHEMA.md
      - docs/LIMITATIONS.md
      - docs/COMPATIBILITY.md
      - CHANGELOG.md
      - docs/pages/**
      - examples/reference_results/sdk_audits_2026-06-05/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown matplotlib pymdown-extensions

      - name: Build documentation site
        run: python docs/pages/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
