[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-backend-bench"
version = "0.2.11"
description = "Backend-agnostic benchmarking toolkit for local quantum SDK simulators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sid Richards" },
]
keywords = [
  "benchmark",
  "cirq",
  "pennylane",
  "qiskit",
  "quantum-computing",
  "quantum-simulation",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://sidrichardsquantum.github.io/Quantum_Backend_Bench/"
Repository = "https://github.com/SidRichardsQuantum/Quantum_Backend_Bench"
Issues = "https://github.com/SidRichardsQuantum/Quantum_Backend_Bench/issues"
Changelog = "https://github.com/SidRichardsQuantum/Quantum_Backend_Bench/blob/main/CHANGELOG.md"
Documentation = "https://sidrichardsquantum.github.io/Quantum_Backend_Bench/usage.html"
[project.optional-dependencies]
braket = [
  "amazon-braket-sdk",
]
cirq = [
  "cirq",
]
cudaq = [
  "cudaq",
]
dev = [
  "build",
  "black",
  "cirq",
  "mypy",
  "pandas",
  "pytest",
  "ruff",
  "twine",
]
docs = [
  "markdown",
  "matplotlib",
  "pymdown-extensions",
]
notebooks = [
  "ipykernel",
  "matplotlib",
  "pandas",
]
pennylane = [
  "pennylane",
]
plot = [
  "matplotlib",
]
pyquil = [
  "pyquil",
]
qbraid = [
  "qbraid",
]
qiskit = [
  "qiskit",
  "qiskit-aer",
]
qsharp = [
  "qsharp",
]
qutip = [
  "qutip",
]
tket = [
  "pytket",
]
yaml = [
  "PyYAML",
]
all = [
  "amazon-braket-sdk",
  "cirq",
  "matplotlib",
  "pennylane",
  "pytket",
  "qbraid",
  "qiskit",
  "qiskit-aer",
  "qsharp",
  "qutip",
  "PyYAML",
]
full = [
  "amazon-braket-sdk",
  "cirq",
  "cudaq",
  "matplotlib",
  "pennylane",
  "pyquil",
  "pytket",
  "qbraid",
  "qiskit",
  "qiskit-aer",
  "qsharp",
  "qutip",
  "PyYAML",
]

[project.scripts]
quantum-bench = "quantum_backend_bench.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["quantum_backend_bench*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["quantum_backend_bench"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not optional_sdk and not docs'"
pythonpath = ["."]
markers = [
  "docs: tests that require optional documentation build tooling",
  "optional_sdk: tests that require optional Python SDK integrations",
  "heavy_sdk: tests that require heavyweight or platform-sensitive SDK integrations",
  "external_runtime: tests that require non-Python local runtime executables or services",
]
